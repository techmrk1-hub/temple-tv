# BGM sync trigger revision: 2
name: Sync BGM Audio

on:
  push:
    paths:
      - ".github/workflows/sync-bgm-audio.yml"
      - "tools/sync_bgm_audio.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temple-tv-bgm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests gdown

      - name: Mirror active BGM links
        run: python tools/sync_bgm_audio.py

      - name: Commit mirrored audio
        run: |
          git config user.name "Temple TV BGM Sync"
          git config user.email "actions@users.noreply.github.com"
          git add music/remote tools/sync_bgm_audio.py .github/workflows/sync-bgm-audio.yml
          if git diff --cached --quiet; then
            echo "No BGM audio changes."
            exit 0
          fi
          git commit -m "Sync BGM audio from Google Sheet"
          git pull --rebase origin main
          git push origin HEAD:main
