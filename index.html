<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chinmaya Saraswati Ashram - Devi Temple</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="tv-screen">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="top-header">

    <div class="brand-zone">

      <img
        src="images/logo.png"
        alt="Temple Logo"
        class="temple-logo"
      >

      <div class="brand-copy">

        <div class="temple-name">
          CHINMAYA SARASWATI ASHRAM
        </div>

        <div class="temple-meta">

          <span>DEVI TEMPLE</span>

          <span class="meta-dot">
            •
          </span>

          <span>
            Orange, Connecticut
          </span>

        </div>

      </div>

    </div>


    <div class="time-zone">

      <div
        id="clock"
        class="clock"
      >
        --:-- --
      </div>

      <div
        id="header-date"
        class="header-date"
      >
        Loading...
      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN CONTENT
  ====================================================== -->

  <main class="content-grid">


    <!-- MAIN FEATURE FLYER -->

    <section class="feature-panel">

      <img
        id="flyer"
        class="feature-flyer"
        src=""
        alt="Temple Event Flyer"
      >

    </section>


    <!-- RIGHT INFORMATION PANEL -->

    <aside class="info-rail">


      <!-- TODAY'S SCHEDULE -->

      <section class="rail-section today-section">

        <div class="section-eyebrow">
          TODAY'S SCHEDULE
        </div>

        <div class="section-rule"></div>

        <div
          id="today-schedule-list"
          class="schedule-list"
        >

          <div class="empty-schedule">
            Loading today's programs...
          </div>

        </div>

      </section>


      <!-- COMMUNITY -->

      <section class="rail-section community-section">

        <div class="section-rule"></div>

        <div class="section-eyebrow community-heading">
          JOIN OUR COMMUNITY
        </div>

        <img
          src="images/whatsapp-qr.png"
          alt="Temple WhatsApp Updates"
          class="community-qr"
        >

        <div class="community-copy">
          Scan to receive temple updates
        </div>

      </section>

    </aside>

  </main>


  <!-- =====================================================
       ANNOUNCEMENTS
  ====================================================== -->

  <section class="ticker-row announcement-row">

    <div class="ticker-label">
      ANNOUNCEMENTS
    </div>

    <div class="ticker-viewport">

      <div
        id="ticker-text"
        class="ticker-track"
      >
        Welcome to Chinmaya Saraswati Ashram - Devi Temple
      </div>

    </div>

  </section>


  <!-- =====================================================
       UPCOMING EVENTS
  ====================================================== -->

  <section class="ticker-row upcoming-row">

    <div class="ticker-label upcoming-label">
      UPCOMING EVENTS
    </div>

    <div class="ticker-viewport">

      <div
        id="upcoming-events-text"
        class="ticker-track upcoming-track"
      >
        Loading upcoming temple events...
      </div>

    </div>

  </section>


</div>


<!-- =======================================================
     BACKGROUND MUSIC PLAYER

     No music file is hard-coded here.
     Google Sheet controls the playlist.
======================================================== -->

<audio
  id="background-music"
  autoplay
  preload="auto"
></audio>


<script src="announcements.js"></script>

<script src="script.js"></script>


</body>

</html>
